          tar xzf /tmp/src.tgz -C . || { echo "::error::源码包解压失败"; exit 1; }
          test -f settings.gradle || { echo "::error::缺少 settings.gradle"; exit 1; }
          test -f app/build.gradle || { echo "::error::缺少 app/build.gradle"; exit 1; }
