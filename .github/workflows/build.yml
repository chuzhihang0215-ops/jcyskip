          tar xzf /tmp/src.tgz -C . || { echo "::error::源码包解压失败"; exit 1; }
          test -f settings.gradle || { echo "::error::缺少 settings.gradle"; exit 1; }
          test -f app/build.gradle || { echo "::error::缺少 app/build.gradle"; exit 1; }
          echo "=== 工程文件 ==="
          find . -type f -not -path './.git/*' | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查 Runner 自带的 Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "--- platforms ---"
          ls "$SDK/platforms" || true
          echo "--- build-tools ---"
          ls "$SDK/build-tools" || true
          java -version

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: build
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JcySkip-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/release/*.apk \
            --title "JcySkip build ${{ github.run_number }}" \
            --notes "auto build" || echo "release exists"
