name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备源码（自动解压任意 zip + 自动定位工程）
        run: |
          echo "========== 仓库根目录 =========="
          ls -la
          echo "========== 全部文件（前 80 个）=========="
          find . -type f -not -path './.git/*' | sort | head -80

          echo "========== 解压仓库里所有 zip =========="
          find . -name '*.zip' -not -path './.git/*' -print | while read -r z; do
            echo "unzip -> $z"
            unzip -q -o "$z" -d . || echo "!! 解压失败: $z"
          done

          echo "========== 定位 Gradle 工程 =========="
          PROJ=""
          for f in $(find . -name 'build.gradle' -not -path './.git/*' | sort); do
            case "$f" in
              */app/build.gradle) PROJ=$(dirname "$(dirname "$f")") ;;
            esac
          done
          if [ -z "$PROJ" ] || [ ! -f "$PROJ/settings.gradle" ]; then
            PROJ=""
            for f in $(find . -name 'settings.gradle' -not -path './.git/*' | sort); do
              PROJ=$(dirname "$f")
              break
            done
          fi
          if [ -z "$PROJ" ]; then
            echo "::error::仓库里没有 Gradle 工程。请确认 JcySkip-src.zip 已上传到仓库根目录，且文件名没有变成 'JcySkip-src (1).zip' 或 'JcySkip-src.zip.zip'。上面的文件清单就是仓库真实内容。"
            exit 1
          fi
          echo "PROJ=$PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          ls -la "$PROJ"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 release APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JcySkip-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布到 Release（手机上可直接点开安装）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            ${PROJ}/app/build/outputs/apk/release/*.apk \
            --title "JcySkip build ${{ github.run_number }}" \
            --notes "自动构建产物，debug 签名，直接安装" || echo "release 已存在，跳过"
